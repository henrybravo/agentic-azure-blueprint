[project]
name = "agentic-api"
version = "0.1.0"
description = "Agentic Azure Blueprint — FastAPI BFF"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
    # Wire these as you add auth + telemetry (see AGENTS.md):
    # "pyjwt[crypto]>=2.9.0",
    # "msal>=1.31.0",
    # "azure-identity>=1.19.0",
    # "azure-monitor-opentelemetry>=1.6.0",
]

[dependency-groups]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
