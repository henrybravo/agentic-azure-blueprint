[project]
name = "orchestrator"
version = "0.1.0"
description = "Agentic Azure Blueprint — LangGraph (Python) agent orchestrator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "langgraph>=0.2.50",
    # Wire these as you connect a real model + durable memory (see graph.py / checkpointer.py):
    # "openai>=1.51.0",
    # "azure-identity>=1.19.0",
    # "azure-cosmos>=4.7.0",
    # "azure-monitor-opentelemetry>=1.6.0",
]

[dependency-groups]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "app", "graph", "checkpointer"]
